name: Klik Content - Windows build

on:
  push:
    paths:
      - "klik-content/**"
      - ".github/workflows/klik-content-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: klik-content/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klik-content/app/src-tauri

      - name: Build Klik Content
        working-directory: klik-content/app
        run: |
          npm ci
          npm run typecheck
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Klik-Content-installer
          path: klik-content/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
