name: Klik - Windows build

on:
  push:
    paths:
      - "klik/app/**"
      - ".github/workflows/klik-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: klik/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: klik/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klik/app/src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Klik-installer
          path: klik/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
