[package]
name = "klik-mcp"
version = "0.1.0"
edition = "2021"
description = "Klik MCP server: lets Claude read Klik captures and a handoff inbox"

[dependencies]
rmcp = { version = "3.10", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
chrono = "0.4"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
